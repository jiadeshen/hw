        <!-- 主要內容區塊 -->
        <div id="main" class="alt">
            <section>
                <div class="inner">
                    <h1>N × N 乘法表</h1>
                    <!-- 輸入區與按鈕 -->
                    <div style="text-align:center; margin-top:20px;">
                        <label for="numberInput">輸入一個數值:</label>
                        <input type="number" id="numberInput" placeholder="輸入一個數值" min="1" />
                        <input type="button" value="OK" title="OK" onclick="myFunction()" />
                    </div>
                    <!-- 乘法表顯示區 -->
                    <div id="myId"></div>
                </div>
            </section>
        </div>

    </div>

    <!-- 產生乘法表的JS函式 -->
    <script>
        function myFunction() {
            var n = document.getElementById('numberInput').value; // 取得輸入值
            var str = "<table>";
            for (let i = 1; i <= n; i++) { // 外層迴圈：列
                str += "<tr>";
                for (let j = 1; j <= n; j++) { // 內層迴圈：欄
                    str += `<td>${i} × ${j} = ${i * j}</td>`;
                }
                str += "</tr>";
            }
            str += "</table>";
            document.getElementById("myId").innerHTML = str; // 顯示在網頁上
        }
    </script>
